[project]
name = "aptum-api"
version = "1.5.0"
description = "Aptum backend: CV profiles, ATS-friendly CV generation and job matching, with role-based access control."
readme = "README.md"
authors = [
    { name = "Victor Castro", email = "victorcastro.io@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6.1",
    "firebase-admin>=7.7.0",
    "reportlab>=5.0.1",
    "scalar-fastapi>=1.9.1",
    "python-docx>=1.2.0",
]

[tool.uv.build-backend]
module-name = "aptum"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    "aptum.core.permissions.require",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
